name: release
on:
  push:
    tags: ['v*']
jobs:
  mcp-tarball:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.14.2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter cooks-mcp build
      - run: cd apps/mcp && pnpm pack --pack-destination ../../dist-release && cd ../../dist-release && cp cooks-mcp-*.tgz cooks-mcp.tgz
      - name: Upload tarballs to the release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "$GITHUB_REF_NAME" dist-release/*.tgz --title "Cooks $GITHUB_REF_NAME" --generate-notes || gh release upload "$GITHUB_REF_NAME" dist-release/*.tgz --clobber
