                      _href: /v1/users/KKLvN5wQoghWFwUvC75CZ12QM7I3
                    prospect:
                      id: 990e8400-e29b-41d4-a716-446655440020
                      _href: /v1/prospects/990e8400-e29b-41d4-a716-446655440020
                    sequence: null
                    sequenceState: null
