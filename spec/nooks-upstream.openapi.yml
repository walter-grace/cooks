      summary: Update a task
      description: >
        Updates one or more fields on an existing task.


        Only the following fields can be changed:

        - `dueAt` reschedules the task to a new due date and time

        - `ownerId` reassigns the task to a different user

        - `priority` changes the task priority (`low`, `normal`, `high`,
        `urgent`)

        - `note` updates the task note (set to `null` to clear)


        At least one field must be provided. All other task fields (action,
        prospect, sequence, etc.) are immutable through this endpoint.
      x-codeSamples:
        - lang: shell
          label: Example (reschedule)
          source: |
            curl -X PATCH 'https://partner-api.nooks.in/v1/tasks/dd0e8400-e29b-41d4-a716-446655440050' \
              -H "Authorization: Bearer nooks-api-..." \
              -H "Content-Type: application/json" \
              -d '{"data": {"dueAt": "2026-04-01T09:00:00.000Z"}}'
        - lang: shell
          label: Example (reassign + reprioritize)
          source: |
            curl -X PATCH 'https://partner-api.nooks.in/v1/tasks/dd0e8400-e29b-41d4-a716-446655440050' \
              -H "Authorization: Bearer nooks-api-..." \
              -H "Content-Type: application/json" \
              -d '{"data": {"ownerId": "ABC123", "priority": "high"}}'
      tags:
        - Tasks
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier for the task
          schema:
            type: string
            format: uuid
          example: dd0e8400-e29b-41d4-a716-446655440050
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Fields to update on the task. At least one field is required.
              additionalProperties: false
              required:
                - data
              properties:
                data:
                  type: object
                  description: >
                    The fields to update. Only `dueAt`, `ownerId`, `priority`,
                    and `note` are

                    accepted. All other fields are rejected. At least one must
                    be provided.
                  minProperties: 1
                  additionalProperties: false
                  properties:
                    dueAt:
                      type: string
                      format: date-time
                      description: New due date/time for the task (ISO 8601 with timezone offset)
                      example: 2026-04-01T09:00:00.000Z
                    ownerId:
                      type: string
                      minLength: 1
                      maxLength: 128
                      pattern: ^[A-Za-z0-9_-]{1,128}$
                      description: ID of the user to reassign the task to (Firebase UID)
                      example: KKLvN5wQoghWFwUvC75CZ12QM7I3
                    priority:
                      type: string
                      enum:
                        - low
                        - normal
                        - high
                        - urgent
                      description: New priority level for the task
                      example: high
                    note:
                      type: string
                      nullable: true
                      description: Updated note for the task. Set to null to clear.
                      example: Follow up after the demo
            example:
              data:
                dueAt: 2026-04-01T09:00:00.000Z
                priority: high
      responses:
        "200":
          description: Task successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
              example:
                id: dd0e8400-e29b-41d4-a716-446655440050
                action: call
                completed: false
                dueAt: 2026-04-01T09:00:00.000Z
                note: Follow up after the demo
                status: ready
                priority: high
                owner:
                  id: KKLvN5wQoghWFwUvC75CZ12QM7I3
                  _href: /v1/users/KKLvN5wQoghWFwUvC75CZ12QM7I3
                prospect:
