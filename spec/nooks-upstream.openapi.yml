            renewal_date: 2026-01-15T00:00:00.000Z
        createdAt:
          type: string
          format: date-time
          description: When the prospect was created
          example: 2025-10-01T10:00:00.000Z
        updatedAt:
          type: string
          format: date-time
          description: When the prospect was last updated
