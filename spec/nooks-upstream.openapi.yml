  /tags:
    get:
      operationId: listTags
      summary: List tags
      description: |
        Returns a paginated list of every tag in the workspace.

        This is the entry point for cohort work: resolve a tag name to its
        `id` here, then apply it to sequences or (once supported) filter
        sequences by it.

        The whole catalog is returned. There is no record-type filter.
        `Tags` rows are untyped, so "tags used on sequences" could only be
        derived from existing attachments, which would hide a tag that has
        just been created from the very lookup that precedes using it.

        Example:
        ```bash
        curl -X GET 'https://partner-api.nooks.in/v1/tags?filter[name]=cold' \
          -H "Authorization: Bearer nooks-api-..."
        ```
      tags:
        - Tags
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageAfter"
        - $ref: "#/components/parameters/PageBefore"
        - name: filter[name]
          in: query
          description: |
            Filter tags by exact name match, compared case-INSENSITIVELY. Tag
            names are unique per workspace on `lower(name)`, so `Cold` and
            `cold` find the same tag, and this returns at most one result.
          required: false
          schema:
            type: string
          example: cold
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Tag"
                  links:
                    $ref: "#/components/schemas/PaginationLinks"
              example:
                data:
                  - id: 770e8400-e29b-41d4-a716-446655440010
                    name: cold
                    createdAt: 2026-01-12T09:30:00Z
                    updatedAt: 2026-01-12T09:30:00Z
                  - id: 770e8400-e29b-41d4-a716-446655440011
                    name: q3-experiment
                    createdAt: 2026-02-01T11:00:00Z
                    updatedAt: 2026-02-01T11:00:00Z
                links:
                  first: https://partner-api.nooks.in/v1/tags?page[size]=50
                  prev: null
                  next: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden. The OAuth token lacks the `tags:read` scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createTag
      summary: Create a tag
      description: |
        Creates a tag in the workspace.

        **Idempotent by name.** Tag names are unique per workspace,
        case-insensitively, so creating a name that already exists returns the
        existing tag with `200` rather than a `409`. A fresh create returns
        `201`. Either way the response carries the tag you asked for, so a
        caller can create-then-use without checking first.

        Example:
        ```bash
        curl -X POST 'https://partner-api.nooks.in/v1/tags' \
          -H "Authorization: Bearer nooks-api-..." \
          -H "Content-Type: application/json" \
          -d '{"data": {"name": "cold"}}'
        ```
      tags:
        - Tags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 255
                      description: |
                        Tag name. Compared case-insensitively against existing
                        tags; leading and trailing whitespace is trimmed, and
                        a name that is empty after trimming is rejected.
                  required:
                    - name
                  additionalProperties: false
              required:
                - data
              additionalProperties: false
            example:
              data:
                name: cold
      responses:
        "200":
          description: |
            A tag with that name already existed (any casing) and is returned
            unchanged
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Tag"
        "201":
          description: Tag created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Tag"
              example:
                data:
                  id: 770e8400-e29b-41d4-a716-446655440010
                  name: cold
                  createdAt: 2026-01-12T09:30:00Z
                  updatedAt: 2026-01-12T09:30:00Z
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden. The OAuth token lacks the `tags:write` scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
        "500":
          $ref: "#/components/responses/InternalError"
