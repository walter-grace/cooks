  /integrations/prospects/sync:
    post:
      operationId: syncProspects
      security:
        - BearerAuth: []
        - OAuth2:
            - prospects:write
      summary: Sync prospects from CRM
      description: >
        Syncs up to 100 CRM records (Salesforce or HubSpot) into Nooks prospects
        by `externalId`, creating them if they don't already exist. Per-record
        outcomes are returned in `results` and `errors`.
      x-codeSamples:
        - lang: shell
          label: Example
          source: >
            curl -X POST
            'https://partner-api.nooks.in/v1/integrations/prospects/sync' \
              -H "Authorization: Bearer nooks-api-..." \
              -H "Content-Type: application/json" \
              -d '{
                "data": {
                  "type": "salesforce",
                  "records": ["003ABC123DEF456", "003XYZ789GHI012"]
                }
              }'
      tags:
        - Prospects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncProspectsRequest"
            example:
              data:
                type: salesforce
                records:
                  - 003ABC123DEF456
                  - 003XYZ789GHI012
      responses:
        "200":
          description: Request processed. Inspect `results` and `errors` for per-record
            outcomes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncProspectsResponse"
              example:
                results:
                  - externalId: 003ABC123DEF456
                    prospectId: 990e8400-e29b-41d4-a716-446655440020
                    created: true
                errors:
                  - externalId: 003XYZ789GHI012
                    code: NOT_FOUND_IN_CRM
                    message: No record found in salesforce for externalId 003XYZ789GHI012
        "400":
          description: Malformed body (`Error`), or the CRM isn't usable
            (`NO_CRM_CONNECTION`). See the `NoCrmConnectionError` schema.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/NoCrmConnectionError"
              example:
                error:
                  code: NO_CRM_CONNECTION
                  message: Your salesforce connection is no longer valid. Reconnect salesforce in
                    Nooks.
                  integrationType: salesforce
                traceId: 6b1c9f2e8d3a4c5b7e9f0a1d2c3b4a5e
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
        "500":
          $ref: "#/components/responses/InternalError"
