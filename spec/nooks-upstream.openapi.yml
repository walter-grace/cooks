              data:
                text: Follow up after legal review.
                integrationType: salesforce
      responses:
        "201":
          description: Note successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
              example:
                id: bb0e8400-e29b-41d4-a716-446655440080
                externalId: 00TABC123DEF456
