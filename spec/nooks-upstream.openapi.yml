openapi: 3.1.0
info:
  title: Nooks Sequencing API
  version: 0.1.0
  description: >
    The Nooks Sequencing API provides programmatic access to manage sequences,
    tasks, templates, and prospect engagement workflows created using the Nooks
    SEP.


    ## Authentication


    Send a bearer token in the `Authorization` header:

    ```

    Authorization: Bearer <token>

    ```


    Two token types are accepted on the same header. The API detects which

    format you sent and validates accordingly. If you already have a token,

    paste it into the Authentication panel and skip the flow setup.


    ### API keys


    Long-lived, workspace-scoped. Best for backend integrations and

    server-to-server automation. Generate one from the API Keys page in

    Developer Settings in your Nooks workspace. API keys are prefixed
    `nooks-api-`

    and have full read/write access within the owning workspace.


    ### OAuth 2.0 access tokens


    Short-lived (1 hour), user-scoped, scope-limited JWTs issued by

    `https://oauth.nooks.in` via the standard authorization-code + PKCE flow.

    Best for third-party apps acting on behalf of a specific user. The token

    carries that user's identity and a subset of scopes the user consented

    to. Refresh tokens rotate every 90 days and are invalidated on first

    re-use (refresh-token reuse detection).


    **Endpoints:**


    - Authorize: `https://oauth.nooks.in/oauth/authorize`

    - Token: `https://oauth.nooks.in/oauth/token`

    - JWKS: `https://oauth.nooks.in/.well-known/jwks.json`

    - Server metadata (RFC 8414):
    `https://oauth.nooks.in/.well-known/oauth-authorization-server`


    **Available scopes:**


    | Scope | Grants |

    | --- | --- |

    | `prospects:read` | View your prospects |

    | `prospects:write` | Create and update prospects |

    | `sequences:read` | View your sequences |

    | `sequences:write` | Create and update sequences, and tag them |

    | `tags:read` | View the workspace tag catalog. Tag names attached to
    sequences are also visible via `GET /sequences?include=tags` under
    `sequences:read`, since scopes are enforced per route, not per include. |

    | `tags:write` | Create tags |

    | `sequence-steps:read` | View sequence steps |

    | `sequence-steps:write` | Create, edit, delete, and reorder sequence steps
    |

    | `sequence-states:read` | View sequence enrollments |

    | `sequence-states:write` | Enroll prospects and manage enrollments |

    | `tasks:read` | View your tasks |

    | `tasks:write` | Create, update, complete, skip, and delete tasks |

    | `calls:read` | View your calls |

    | `calls:write` | Create and update calls |

    | `call-dispositions:read` | View call dispositions |

    | `emails:read` | View your emails |

    | `emails:write` | Create and update emails |

    | `email-templates:read` | View your email templates |

    | `mailboxes:read` | View connected mailboxes |

    | `users:read` | View users in your workspace |

    | `accounts:read` | View accounts (companies) in your workspace |

    | `notes:write` | Create notes on CRM-backed prospects and accounts |

    | `opportunities:read` | View opportunities (deals) in your workspace |

    | `search:read` | Search across your prospects, accounts, and other records
    |


    ## Rate limiting

    API requests are rate limited per workspace and per endpoint in a fixed

    one-minute window. Separate endpoint buckets do not share quota, except

    routes without an explicit limit use the shared default bucket.


    Every response includes these headers:

    - `X-RateLimit-Limit` -- maximum requests allowed in the current per-minute
    window

    - `X-RateLimit-Remaining` -- requests remaining in the current window

    - `X-RateLimit-Reset` -- seconds until the current window resets


    When the limit is exceeded the API returns `429 Too Many Requests` with a

    `Retry-After` header indicating how many seconds to wait before retrying.


    **Current limits:**


    | Endpoint class | Methods | Limit |

    | --- | --- | --- |

    | List reads: `/sequences`, `/emails`, `/users`, `/sequenceStates`,
    `/prospects`, `/mailboxes`, `/calls`, `/sequenceSteps`, `/callDispositions`,
    `/tasks`, `/accounts`, `/tags`, `/emailTemplates` | `GET` | 300
    requests/minute per endpoint |

    | Read by ID: `/sequences/{id}`, `/emails/{id}`, `/users/{id}`,
    `/sequenceStates/{id}`, `/prospects/{id}`, `/mailboxes/{id}`, `/calls/{id}`,
    `/sequenceSteps/{id}`, `/callDispositions/{id}`, `/tasks/{id}`,
    `/accounts/{id}`, `/emailTemplate/{id}`, `/tags/{id}` | `GET` | 600
    requests/minute per endpoint |

    | Sequence writes: `/sequences`, `/sequences/{id}`,
    `/sequences/{id}/actions/reorderSteps` | `POST`, `PATCH` | 120
    requests/minute per endpoint |

    | Tag writes: `/tags` | `POST` | 120 requests/minute per endpoint |

    | Sequence step writes: `/sequenceSteps`, `/sequenceSteps/{id}` | `POST`,
    `PATCH`, `DELETE` | 120 requests/minute per endpoint |

    | Sequence state writes: `/sequenceStates`, `/sequenceStates/{id}`,
    `/sequenceStates/{id}/actions/finish` | `POST`, `DELETE` | 120
    requests/minute per endpoint |

    | Task writes: `/tasks`, `/tasks/{id}`, `/tasks/{id}/complete`,
    `/tasks/{id}/skip` | `POST`, `PATCH`, `DELETE` | 120 requests/minute per
    endpoint |

    | CRM note writes: `/prospects/{id}/notes`, `/accounts/{id}/notes` | `POST`
    | 30 requests/minute per endpoint |

    | `/integrations/prospects/sync` | `POST` | 20 requests/minute |

    | Any other endpoint | Any | 30 requests/minute, shared default bucket |


    ## Pagination

    List endpoints support cursor-based pagination using the `page[size]` and
    `page[after]`/`page[before]` query parameters.

    - Maximum page size: 100

    - Default page size: 50


    ## Include (inline expansion)

    Most GET endpoints support an `include` query parameter that expands related
    `ReferenceObject` fields inline,

    so you do not need a follow-up request per reference.


    Pass comma-separated field names: `?include=field1,field2`


    **Without include:**

    ```json

    GET /v1/prospects/123


    {
      "id": "123",
      "sequenceStates": [
        { "id": "ss-1", "_href": "/v1/sequenceStates/ss-1" }
      ]
    }

    ```


    **With `include=sequenceStates`:**

    ```json

    GET /v1/prospects/123?include=sequenceStates


    {
      "id": "123",
      "sequenceStates": [
        {
          "id": "ss-1",
          "_href": "/v1/sequenceStates/ss-1",
          "state": "active",
          "sequence": { "id": "seq-1", "_href": "/v1/sequences/seq-1" },
          "prospect": { "id": "123", "_href": "/v1/prospects/123" },
          "creator": { "id": "u-1", "_href": "/v1/users/u-1" },
          "sequenceStep": null,
          "createdAt": "2024-01-01T00:00:00Z",
          "updatedAt": "2024-01-01T00:00:00Z"
        }
      ]
    }

    ```


    The expanded object is a superset of `ReferenceObject`. It keeps `id` and
    `_href` and adds all DTO fields.

    The response shape is unchanged; the field just contains richer data.


    **Hard constraints (enforced with 400 errors):**

    - **Max 3 includes per request.** Requesting more than 3 comma-separated
    values returns `400: "include accepts at most 3 values"`.

    - **GET endpoints only.** POST, PATCH, and DELETE endpoints do not accept
    `include`.

    - **No nested includes.** Only top-level field names are valid (e.g.,
    `sequenceStates`). Dot-notation like `sequenceStates.prospect` returns 400.

    - **`account` on Prospect is not includable.** Requesting `include=account`
    returns 400.


    Each endpoint's `include` parameter lists the valid field names for that
    resource.
