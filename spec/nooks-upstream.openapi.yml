  x-scalar-sdk-installation:
    - lang: Claude
      description: >
        Nooks is listed in the Claude connector directory. Open

        [Nooks in the Claude
        directory](https://claude.ai/directory/nooks?q=nooks),

        click **Connect**, and sign in with your Nooks account when prompted.

        Claude then gets the same tools the Nooks MCP server exposes, limited

        to the scopes you consent to.
    - lang: MCP
      description: >
        Connect an AI assistant (Cursor or any other MCP client) to your

        Nooks workspace through the hosted **Nooks MCP server**. It

        exposes the resources in this reference as tools and enforces the

        scopes you consent to.


        The server URL is `https://mcp.nooks.in/mcp` (Streamable HTTP, OAuth
        2.0).


        1. Create an OAuth app on the OAuth Apps page in Developer Settings in
        your
           Nooks workspace. Use its client ID and secret when your MCP client
           asks for credentials.
        2. Add the server to your client. For clients that take an
           `mcpServers` JSON config:

           ```json
           {
             "mcpServers": {
               "nooks": { "url": "https://mcp.nooks.in/mcp" }
             }
           }
           ```

        3. Sign in with your Nooks account when the client opens the consent
           screen.

        MCP connections also expose Nooks Dialer activity and activity synced

        from other sequencing tools, which the REST endpoints do not.
